<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D2C · Codex 운영 스튜디오</title><meta name="description" content="상품과 주문을 확인하고 Codex와 함께 마케팅 콘텐츠를 제작하는 로컬 운영 도구"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="D2C 운영 스튜디오 홈"><span class="brand-mark">d2c<span>↗</span></span><span>CODEX WORKSPACE</span></a>
    <div class="workspace-label"><span class="status-dot"></span> 내 PC 작업 공간</div>
    <nav aria-label="주요 메뉴">
      <button class="nav-item active" data-view="today"><span>✓</span> 오늘 할 일</button>
      <button class="nav-item" data-view="studio"><span>✦</span> 마케팅 스튜디오</button>
      <button class="nav-item" data-view="products"><span>▦</span> 상품 보관함</button>
      <button class="nav-item" data-view="orders"><span>≡</span> 주문 · 수집 기록</button>
      <button class="nav-item" data-view="connections"><span>⚙</span> 연결 · 채널</button>
    </nav>
    <div class="sidebar-bottom"><strong>조사부터 게시까지,<br>한 화면에서.</strong><p>구독 Codex가 동향과 카피를 만들고 로컬 도구가 이미지와 게시를 이어갑니다.</p><span class="version">독립 로컬 버전 · 0.5</span></div>
  </aside>
  <main>
    <header class="topbar"><div><span class="eyebrow">D2C OPERATIONS</span><h1 id="view-title">오늘 할 일</h1></div><div class="header-actions"><span id="ai-connection" class="pill">AI 확인 중</span><span id="connection" class="pill">연결 확인 중</span><button id="refresh" class="button secondary">새로고침</button></div></header>
    <div id="error-banner" role="alert" hidden></div>
    <div id="app" aria-live="polite"><div class="empty"><h2>작업 공간을 불러오고 있습니다.</h2></div></div>
  </main>
  <div id="toast" role="status" hidden></div>
  <dialog id="product-dialog"><form id="product-form"><div class="dialog-heading"><h2>상품 추가</h2><button type="button" class="icon-button" data-close="product-dialog" aria-label="닫기">×</button></div><p class="muted">판매 중인 실제 상품 정보를 입력하세요.</p><label>상품명<input name="name" required maxlength="300"></label><div class="two-col"><label>판매가 (원)<input name="price" type="number" min="0" step="1" required></label><label>재고 (모르면 비워 두기)<input name="stock" type="number" min="0" step="1"></label></div><label>상품 사진 URL<input name="imageUrl" type="url" placeholder="https://…"></label><label>판매 페이지 URL<input name="productUrl" type="url" placeholder="https://…"></label><label>확인된 상품 정보<textarea name="facts" rows="4" maxlength="8000" placeholder="구성, 원산지, 배송 조건 등 실제 확인된 내용"></textarea></label><p class="form-error" role="alert"></p><button class="button primary" type="submit">상품 저장</button></form></dialog>
  <dialog id="campaign-dialog"><form id="campaign-form"><div class="dialog-heading"><h2>새 캠페인</h2><button type="button" class="icon-button" data-close="campaign-dialog" aria-label="닫기">×</button></div><label>홍보할 상품<select name="productId" id="campaign-product" required></select></label><label>캠페인 제목<input name="title" maxlength="300" placeholder="예: 주말 캠핑 메뉴 제안"></label><fieldset class="channel-checks"><legend>게시할 채널</legend><label class="check-label campaign-channel"><input name="targetChannel" type="checkbox" value="instagram"><span>Instagram<small data-channel-state="instagram"></small></span></label><label class="check-label campaign-channel"><input name="targetChannel" type="checkbox" value="threads"><span>Threads<small data-channel-state="threads"></small></span></label><label class="check-label campaign-channel"><input name="targetChannel" type="checkbox" value="band"><span>네이버 밴드<small data-channel-state="band"></small></span></label></fieldset><label>Codex에 전달할 제작 방향<textarea name="brief" rows="5" maxlength="6000" placeholder="대상 고객, 강조할 내용, 말투, 사용 사진, 피하고 싶은 표현을 적어 주세요."></textarea></label><p class="form-error" role="alert"></p><button class="button primary" type="submit">캠페인 만들기</button></form></dialog>
  <dialog id="store-dialog"><form id="store-form"><div class="dialog-heading"><h2>네이버 스마트스토어 연결</h2><button type="button" class="icon-button" data-close="store-dialog" aria-label="닫기">×</button></div><input type="hidden" id="store-original-id"><label>화면에 표시할 스토어 이름<input id="store-name" required maxlength="100" placeholder="예: 바다마켓"></label><label>스토어 식별자<input id="store-id" required pattern="[A-Za-z0-9_-]+" maxlength="60" placeholder="예: bada-market"></label><p id="store-secret-note" class="muted"></p><label>Client ID<input id="store-client-id" type="password" autocomplete="off" maxlength="200"></label><label>Client Secret<input id="store-client-secret" type="password" autocomplete="new-password" maxlength="300"></label><label class="check-label"><input id="store-enabled" type="checkbox" checked>전체 수집과 화면에서 이 연결을 사용합니다.</label><p class="form-error" role="alert"></p><button class="button primary" type="submit">연결 저장</button></form></dialog>
</body></html>
